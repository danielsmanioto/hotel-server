services:
  mongo:
    image: mongo:7
    container_name: hotel-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./infra/data:/data/db

  hotel-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-server
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/hotel
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
